name: Web & Desktop CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: MyWorksAppProyect/myworksapp_web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            MyWorksAppProyect/shared/package-lock.json
            MyWorksAppProyect/myworksapp_web/package-lock.json

      - name: Install shared dependencies
        run: npm ci
        working-directory: MyWorksAppProyect/shared

      - name: Check domain drift (TS ↔ Dart)
        run: npm run check:domain
        working-directory: MyWorksAppProyect/shared

      - name: Generate Dart domain from TS
        run: npm run generate:domain
        working-directory: MyWorksAppProyect/shared

      - name: Test shared domain
        run: npm test
        working-directory: MyWorksAppProyect/shared

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true

  desktop:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: MyWorksAppProyect/myworksapp_desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            MyWorksAppProyect/shared/package-lock.json
            MyWorksAppProyect/myworksapp_desktop/package-lock.json

      - name: Install shared dependencies
        run: npm ci
        working-directory: MyWorksAppProyect/shared

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  desktop-tauri:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: MyWorksAppProyect/myworksapp_desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            MyWorksAppProyect/shared/package-lock.json
            MyWorksAppProyect/myworksapp_desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install shared dependencies
        run: npm ci
        working-directory: MyWorksAppProyect/shared

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build
